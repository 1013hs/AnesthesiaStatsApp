<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻醉统计</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            position: relative;
            background-color: #f5f5f7;
            color: #333;
        }

        /* 背景壁纸遮罩层 */
        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            opacity: 0.3; /* 默认透明度 30% */
            transition: opacity 0.2s ease;
        }

        /* 主容器 */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 控制面板卡片 */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #1d1d1f;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        label {
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* 隐藏原生的 file input，用 label 自定义按钮 */
        input[type="file"] {
            display: none;
        }

        .btn {
            background-color: #007aff;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-block;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn:active {
            background-color: #0056b3;
        }

        .btn-danger {
            background-color: #ff3b30;
        }

        /* 透明度滑块 */
        .range-slider {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-top: 5px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            accent-color: #007aff;
        }

        .opacity-val {
            font-size: 0.9rem;
            width: 40px;
            text-align: right;
            color: #666;
        }
    </style>
</head>
<body>

    <!-- 背景壁纸层 -->
    <div id="bg-overlay"></div>

    <div class="container">
        <!-- 壁纸设置区域 -->
        <div class="card">
            <h2>🎨 壁纸与外观设置</h2>
            <div class="setting-group">
                <div class="row">
                    <label>自定义壁纸：</label>
                    <div>
                        <label for="wallpaper-upload" class="btn">选择图片</label>
                        <input type="file" id="wallpaper-upload" accept="image/*">
                        <button id="reset-bg" class="btn btn-danger" style="display:none;">重置</button>
                    </div>
                </div>

                <div class="setting-group" style="margin-top: 8px;">
                    <label>壁纸透明度：</label>
                    <div class="range-slider">
                        <input type="range" id="opacity-range" min="0" max="100" value="30">
                        <span id="opacity-value" class="opacity-val">30%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 你的主应用界面内容加在这里 -->
        <div class="card">
            <h2>📊 麻醉统计主界面</h2>
            <p style="color: #666; font-size: 0.9rem;">软件已成功运行！你可以在上方随心调整背景壁纸及透明度。</p>
        </div>
    </div>

    <script>
        const bgOverlay = document.getElementById('bg-overlay');
        const uploadInput = document.getElementById('wallpaper-upload');
        const resetBtn = document.getElementById('reset-bg');
        const opacityRange = document.getElementById('opacity-range');
        const opacityValue = document.getElementById('opacity-value');

        // 1. 初始化读取本地保存的壁纸与透明度
        window.addEventListener('DOMContentLoaded', () => {
            const savedBg = localStorage.getItem('app_wallpaper');
            const savedOpacity = localStorage.getItem('app_wallpaper_opacity') || '30';

            if (savedBg) {
                bgOverlay.style.backgroundImage = `url(${savedBg})`;
                resetBtn.style.display = 'inline-block';
            }

            opacityRange.value = savedOpacity;
            opacityValue.textContent = savedOpacity + '%';
            bgOverlay.style.opacity = savedOpacity / 100;
        });

        // 2. 上传壁纸处理
        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (evt) {
                    const base64Img = evt.target.result;
                    bgOverlay.style.backgroundImage = `url(${base64Img})`;
                    resetBtn.style.display = 'inline-block';
                    // 保存至本地存储
                    try {
                        localStorage.setItem('app_wallpaper', base64Img);
                    } catch (err) {
                        alert('图片尺寸较大，建议上传小于 2MB 的图片');
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        // 3. 重置壁纸
        resetBtn.addEventListener('click', () => {
            bgOverlay.style.backgroundImage = 'none';
            localStorage.removeItem('app_wallpaper');
            resetBtn.style.display = 'none';
            uploadInput.value = '';
        });

        // 4. 调整透明度实时响应
        opacityRange.addEventListener('input', (e) => {
            const val = e.target.value;
            opacityValue.textContent = val + '%';
            bgOverlay.style.opacity = val / 100;
            localStorage.setItem('app_wallpaper_opacity', val);
        });
    </script>
</body>
</html>
